<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #131314; font-family: 'Cairo', sans-serif; color: #e3e3e3; display: flex; }
        .sidebar { width: 280px; background-color: #1e1f20; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid #2e2f30; padding: 15px; flex-shrink: 0; }
        .sidebar-top { display: flex; flex-direction: column; gap: 20px; }
        .brand { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 5px; }
        .brand i { color: #4a90e2; }
        .sidebar-btn { background: #2b2c2d; color: #e3e3e3; border: none; padding: 12px 15px; border-radius: 8px; text-align: right; font-family: 'Cairo', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; }
        .sidebar-btn.story i { color: #ff7043; }
        .sidebar-btn.key-setting { border: 1px solid #4a90e2; background: rgba(74, 144, 226, 0.1); color: #8ab4f8; }
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background-color: #131314; overflow: hidden; }
        .chat-window { flex: 1; padding: 20px 5% 150px 5%; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }
        .message { display: flex; gap: 15px; padding: 14px 18px; border-radius: 12px; max-width: 85%; line-height: 1.7; font-size: 15px; align-items: flex-start; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-start; background-color: #2b2c2d; color: #fff; border-bottom-right-radius: 2px; }
        .message.assistant { align-self: flex-end; background-color: transparent; color: #e3e3e3; width: 100%; max-width: 100%; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; overflow: hidden; }
        .message.user .message-avatar { background-color: #37393b; color: #8ab4f8; font-size: 16px; }
        .message.assistant .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-text { flex: 1; white-space: pre-wrap; padding-top: 2px; }
        .message.loading .message-text { color: #9aa0a6; font-style: italic; }
        .chat-input-wrapper { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 5% 40px 5%; background: #131314; z-index: 999; border-top: 1px solid #2e2f30; }
        .chat-input-area { display: flex; background-color: #1e1f20; border: 1px solid #3c4043; border-radius: 28px; padding: 6px 15px 6px 6px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 800px; margin: 0 auto; }
        .chat-input-area input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; font-family: 'Cairo', sans-serif; font-size: 16px; outline: none; min-width: 0; }
        .chat-input-area button { background: #1a73e8; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 12px 15px; border-left: none; border-bottom: 1px solid #2e2f30; }
            .brand { justify-content: center; font-size: 18px; padding: 5px; }
            .chat-container { height: calc(100vh - 140px); flex: 1; }
            .chat-window { padding: 15px 4% 160px 4%; gap: 15px; }
            .chat-input-wrapper { padding: 15px 4% 35px 4%; } 
            .message { max-width: 95%; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="brand"><i class="fa-solid fa-feather-pointed"></i> <span>شاهين شات</span></div>
            <div class="menu-section">
                <a href="https://payhip.com/" target="_blank" class="sidebar-btn story"><i class="fa-solid fa-book-open"></i> <span>خيوط الياسمين في مهبّ الغربة</span></a>
            </div>
            <div class="menu-section">
                <button onclick="promptForApiKey()" class="sidebar-btn key-setting"><i class="fa-solid fa-key"></i> <span>تحديث مفتاح API السري</span></button>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-window" id="chat-window">
            <div class="message assistant">
                <div class="message-avatar"><img src="5.jpg" alt="شاهين" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6134/6134346.png'"></div>
                <div class="message-text" id="welcome-text">مرحباً بك في منصة شاهين شات المتصلة بالإنترنت. يرجى تفعيل مفتاحك السري للبدء.</div>
            </div>
        </div>
        <div class="chat-input-wrapper">
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اسأل شاهين شات عن أي شيء مباشر...">
                <button id="send-button"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

<script>
const SYSTEM_INSTRUCTION = "أنت شاهين شات، نموذج ذكاء اصطناعي ومساعد ذكي متطور متصل ببحث Google لحظياً. أجب على كافة أسئلة المستخدمين بدقة وذكاء وفخامة وبأسلوب وقور وحكيم يعكس التوازن القيادي والإنساني، واستخدم البحث دائماً لجلب الأرقام والطقس والمعلومات الحية بدقة.";

function getApiKey() { return localStorage.getItem("SHAHEEN_GEMINI_KEY"); }

function promptForApiKey() {
    const key = prompt("يرجى لصق مفتاح جيميناي (Gemini API Key) الجديد والنظيف هنا:");
    if (key && key.trim().startsWith("AIzaSy")) {
        localStorage.setItem("SHAHEEN_GEMINI_KEY", key.trim());
        alert("✅ تم حفظ مفتاحك بنجاح! الموقع جاهز للبحث والعمل الآن.");
        location.reload();
    } else if (key) { alert("❌ المفتاح غير صحيح"); }
}

async function sendMessageToGemini(userMessage) {
    const apiKey = getApiKey();
    if (!apiKey) return "⚠️ تنبيه: يرجى الضغط على زر 'تحديث مفتاح API السري' ووضعه لتفعيل المحرك.";

    const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    
    // ضبط الإعدادات لتفعيل أداة بحث جوجل (Google Search Tools) تلقائياً مع كل سؤال
    const requestBody = { 
        contents: [{ role: "user", parts: [{ text: SYSTEM_INSTRUCTION + "\n\nسؤال المستخدم الحالي: " + userMessage }] }],
        tools: [{ googleSearch: {} }] 
    };

    try {
        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(requestBody) });
        const data = await response.json();
        if (data.error) return "❌ تنبيه من خوادم جوجل: " + data.error.message;
        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            return data.candidates[0].content.parts[0].text;
        } else { return "الاستجابة فارغة، يرجى إعادة المحاولة."; }
    } catch (error) { return "❌ خطأ في الشبكة: " + error.message; }
}

let inputElement, sendBtnElement;
document.addEventListener("DOMContentLoaded", () => {
    inputElement = document.getElementById("chat-input");
    sendBtnElement = document.getElementById("send-button");
    if (!getApiKey()) {
        document.getElementById("welcome-text").innerHTML = "🦅 مرحباً بك في <b>شاهين شات المطور بالبحث الحي</b>.<br><br>يرجى الضغط على زر <b>'تحديث مفتاح API السري'</b> في الأعلى ولصق مفتاحك الجديد النظيف والآمن كلياً.";
    } else {
        document.getElementById("welcome-text").innerHTML = "مرحباً بك في منصة شاهين شات المتصلة بـ Google للبحث المباشر. كيف يمكنني مساعدتك بمعلومات حية اليوم؟";
    }
    if (sendBtnElement && inputElement) {
        sendBtnElement.addEventListener("click", handleSend);
        inputElement.addEventListener("keypress", (e) => { if (e.key === "Enter") handleSend(); });
    }
});

async function handleSend() {
    const messageText = inputElement.value.trim(); if (!messageText) return;
    appendMessage(messageText, "user", '<i class="fa-solid fa-user"></i>');
    inputElement.value = "";
    appendMessage("جاري البحث في Google وتحليل البيانات الحية...", "loading", '<img src="5.jpg" alt="شاهين" onerror="this.src=\'https://cdn-icons-png.flaticon.com/512/6134/6134346.png\'">');
    const aiResponse = await sendMessageToGemini(messageText);
    removeLoadingMessage();
    appendMessage(aiResponse, "assistant", '<img src="5.jpg" alt="شاهين" onerror="this.src=\'\'">');
}
function appendMessage(text, sender, avatarContent) {
    const chatWindow = document.getElementById("chat-window"); if (!chatWindow) return;
    const msgDiv = document.createElement("div"); msgDiv.className = `message ${sender}`;
    if (sender === "loading") msgDiv.id = "gemini-loading";
    msgDiv.innerHTML = `<div class="message-avatar">${avatarContent}</div><div class="message-text">${text}</div>`;
    chatWindow.appendChild(msgDiv); chatWindow.scrollTop = chatWindow.scrollHeight;
}
function removeLoadingMessage() { const loadingDiv = document.getElementById("gemini-loading"); if (loadingDiv) loadingDiv.remove(); }
</script>
</body>
</html>
